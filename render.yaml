# Render.yaml Deployment Blueprint for FeridhooTours (Laravel + Livewire + Neon PostgreSQL)
services:
  - type: web
    name: feridhootours-app
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: COMPOSER_NO_AUDIT
        value: "1"
      - key: COMPOSER_ALLOW_SUPERUSER
        value: "1"
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: APP_KEY
        sync: false
